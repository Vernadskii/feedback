version: '3'

x-backend-env:
  &backend-env
    APP_ENVIRONMENT: ${APP_ENVIRONMENT}
    APP_DEBUG: ${APP_DEBUG}
    APP_LOG_LEVEL: ${APP_LOG_LEVEL}
    APP_API_URL: ${APP_API_URL}
    APP_CLIENT_URL: ${APP_CLIENT_URL}
    DB_HOST: ${DB_HOST}
    DB_PORT: ${DB_PORT}
    DB_USER: ${DB_USER}
    DB_NAME: ${DB_NAME}
    DB_PASSWORD: ${DB_PASSWORD}
    MQ_HOSTS: 'rabbitmq'
    MQ_USER: ${MQ_USER}
    MQ_PASS: ${MQ_PASS}
    MQ_VHOST: ${MQ_VHOST}

x-backend:
  &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: on-failure
  volumes:
    - "../../app/backend/:/var/app"
  environment:
    <<: *backend-env
    APP_LABEL: "backend"
  stdin_open: true
  tty: true


services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *backend-env
      APP_LABEL: "backend"
    ports:
     - "8080:8000"
    depends_on:
      - postgres_db
      - minio

  watcher_receipt_process:
    <<: *backend
    ports:
      - "5686:5678"
    command:
      poetry run /app/src/manage.py receipt_process
    depends_on:
      - postgres_db
      - rabbitmq
    environment:
      <<: *backend-env
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  watcher_poll_notification:
    <<: *backend
    ports:
      - "5687:5678"
    command:
      poetry run /app/src/manage.py poll_notifications
    depends_on:
      - postgres_db
      - rabbitmq
    environment:
      <<: *backend-env
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_URL: ${APP_API_URL}
    ports:
      - "5173:5173"

  postgres_db:
    image: postgres:16
    expose:
      - 5432
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - ${DB_PORT}:5432
    volumes:
      - ./data/postgres_db:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"  # RabbitMQ default port
      - "15672:15672"  # Management UI default port
    volumes:
      - ./data/mq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${MQ_USER}
      RABBITMQ_DEFAULT_PASS: ${MQ_PASS}
      RABBITMQ_DEFAULT_VHOST: ${MQ_VHOST}
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  minio:
    restart: on-failure
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    expose:
      - 9000
      - 9001
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    command: server --address ":9000" --console-address ":9001" /export
    volumes:
      - ./data/minio:/export
      - ./data/minio:/root/.minio
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
